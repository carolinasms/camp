<!DOCTYPE html>
<html lang="pt-BR">

<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d28d9">
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAMINHADA DOS PETIANOS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: "TT Berlinerins";
    src: url("tt-berlinerins-trial-grotesk.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f2f2f2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f2f2f2;
}

/* ================= HEADER ================= */
 
header{
    background:#0b1b4e;
    color:white;
    text-align:center;
    padding:2px;
    font-family:"TT Berlinerins", cursive;
}

header h1{
    font-size:80px;
    margin-top:0px;
}

header p{
    font-size:30px;
    margin-top:0px;
    font-family:"Bungee", sans-serif;
    font-weight:regular;
    margin-bottom:10px;
}

/* ================= PESQUISA ================= */

#pesquisa{
    flex:1;
    margin:0;

    padding:12px;

    border:none;
    border-radius:8px;

    font-size:16px;

    font-family:"Parkinsans", sans-serif;
}

/* ================= ORDENAÇÃO ================= */

.ordenacao{

position:relative;

}

#btnOrdenar{

width:%;
padding:12px;

color:#0b1b4e;

background:white;

border:none;

border-radius:8px;

font-family:"Parkinsans", sans-serif;

font-size:15px;

cursor:pointer;

box-shadow:0 0 0 rgba(0,0,0,0);

text-align:left;

}

.menuOrdenar{

display:none;

position:absolute;

color:#0b1b4e; 
  
width:100%;

background:white;

border-radius:8px;

box-shadow:0 5px 15px rgba(0,0,0,.15);

overflow:hidden;

z-index:1000;

margin-top:5px;

}

.menuOrdenar div{

padding:12px;

cursor:pointer;

font-family:"Parkinsans", sans-serif;

transition:.2s;

}

.menuOrdenar div:hover{

background:#f2f2f2;

}

/* ================= BARRA DE PESQUISA ================= */

.barraPesquisa{

display:flex;

align-items:center;

justify-content:center;

gap:10px;

width:90%;

max-width:900px;

margin:25px auto;

}
  
/* ================= LOJA ================= */

#loja{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:20px;

    padding:20px;

}

/* ================= CARD ================= */

.card{

    background:white;

    width:230px;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    text-align:center;

    transition:.3s;

}

.card:hover{

    transform:translateY(-5px);

}

.card img{

    width:100%;

    height:180px;

    object-fit:cover;

}

.card h2{

    margin-top:15px;

    color:#0b1b4e;
  
    font-size:18px;

    font-family:"Bungee", sans-serif;
  
    font-weight:regular;
}

.card p{

    font-family:"Parkinsans", sans-serif;

}

.pontos{

    color:#0b5394;
  
    margin:2px;
  
    font-weight:regular;

    font-size:15px;

}

.estoque{

    color:#555;
  
    font-size:13px;

    margin-top:10px;
  
    font-weight:bold;
  
    opacity: 0.4;
  
    margin-bottom:18px;

}

</style>

</head>

<body>

<header>

<logo><img src="https://i.ibb.co/8ncnX61y/Logos-PET-EQ-pdf.png" alt="Logo PET-EQ" class="logo" width=100px style="margin-top:0px; margin-bottom:0px; margin-left:30px; margin-right:30px"></logo>

<h1>CAMINHADA DOS PETIANOS</h1>

<p>PET Engenharia Química</p>

</header>

<div class="barraPesquisa">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar prêmio...">

<div class="ordenacao">

<button id="btnOrdenar" onclick="toggleMenu()">
Ordenar por ▼
</button>

<div id="menuOrdenar" class="menuOrdenar">

<div onclick="ordenar('az')">Nome (A-Z)</div>

<div onclick="ordenar('za')">Nome (Z-A)</div>

<div onclick="ordenar('maior')">Maior pontuação</div>

<div onclick="ordenar('menor')">Menor pontuação</div>

</div>

</div>

</div>

<div id="loja"></div>

<script>

const produtos=[

{
nome:"Boné PET",
pontos:15,
estoque:3,
imagem:"https://placehold.co/300x200?text=Boné"
},

{
nome:"Caneca PET",
pontos:10,
estoque:5,
imagem:"https://placehold.co/300x200?text=Caneca"
},

{
nome:"Ecobag",
pontos:12,
estoque:4,
imagem:"https://placehold.co/300x200?text=Ecobag"
},

{
nome:"Chaveiro",
pontos:8,
estoque:10,
imagem:"https://placehold.co/300x200?text=Chaveiro"
}

];

const loja=document.getElementById("loja");

let ordemAtual="az";

function toggleMenu(){

    const menu = document.getElementById("menuOrdenar");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }

}

function ordenar(tipo){

    ordemAtual = tipo;

    atualizarLista();

    const nomes = {
        az: "Nome (A-Z)",
        za: "Nome (Z-A)",
        maior: "Maior pontuação",
        menor: "Menor pontuação"
    };

    document.getElementById("btnOrdenar").innerHTML = nomes[tipo] + " ▼";

    document.getElementById("menuOrdenar").style.display = "none";

}

function atualizarLista(){

    const texto = document.getElementById("pesquisa").value.toLowerCase();

    let lista = produtos.filter(produto =>
        produto.nome.toLowerCase().includes(texto)
    );

    switch(ordemAtual){

        case "az":
            lista.sort((a,b)=>a.nome.localeCompare(b.nome));
            break;

        case "za":
            lista.sort((a,b)=>b.nome.localeCompare(a.nome));
            break;

        case "maior":
            lista.sort((a,b)=>b.pontos-a.pontos);
            break;

        case "menor":
            lista.sort((a,b)=>a.pontos-b.pontos);
            break;

    }

    mostrar(lista);

}

function mostrar(lista){

loja.innerHTML="";

lista.forEach(produto=>{

loja.innerHTML+=`

<div class="card">

<img src="${produto.imagem}" alt="${produto.nome}">

<h2>${produto.nome}</h2>

<p class="pontos"> ${produto.pontos} pontos</p>

<p class="estoque"> Estoque: ${produto.estoque}</p>

</div>

`;

});

}

atualizarLista();

document.getElementById("pesquisa").addEventListener("input", atualizarLista);
  
window.addEventListener("click", function(e){

    if(!e.target.closest(".ordenacao")){
        document.getElementById("menuOrdenar").style.display = "none";
    }

});
  
</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log("Service Worker registrado!"))
    .catch(err => console.log("Erro ao registrar:", err));
}
</script>
    
</body>

</html>
